name: Build and publish BERTIE firmware

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - '.github/workflows/publish-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bertie-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Embed build number
        run: |
          printf '#pragma once\n#define BERTIE_BUILD_NUMBER %s\n' "$GITHUB_RUN_NUMBER" > include/build_version.h
      - name: Compile application firmware
        run: pio run -e cardputer-adv
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            '.pio/build/cardputer-adv/firmware.bin#firmware.bin' \
            --title "BERTIE build ${GITHUB_RUN_NUMBER}" \
            --notes "Cardputer ADV application firmware. Install via Fn + U or browser OTA (not at flash offset 0x0)." \
            --latest
